<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>SimpChat</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400,50;9..144,500,50;9..144,600,50&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=7">
  <script src="config.js?v=7"></script>
</head>
<body>
  <div id="name-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop"></div>
    <div class="modal-box">
      <h1 id="modal-title">Who are you?</h1>
      <p>Select your identity to start chatting</p>
      <div class="identity-buttons">
        <button id="btn-arnav" class="identity-btn">Arnav</button>
        <button id="btn-ojas" class="identity-btn">Ojas</button>
      </div>
      <div id="password-group" class="hidden">
        <p>Enter password for Ojas</p>
        <div class="modal-input-row">
          <input type="password" id="password-input" placeholder="Password" autocomplete="off" aria-label="Password">
          <button id="password-submit" aria-label="Verify">Verify</button>
        </div>
        <span id="password-error" class="error-text hidden">Incorrect password</span>
      </div>
    </div>
  </div>

  <div id="app" class="hidden" role="application" aria-label="Chat application">
    <header id="header" role="banner">
      <div class="header-left">
        <div class="friend-info">
          <span class="friend-name" id="friend-name"></span>
          <span class="status-indicator">
            <span class="status-dot" id="status-dot" aria-hidden="true"></span>
            <span class="status-text" id="status-text">offline</span>
          </span>
        </div>
      </div>
      <div class="header-right">
        <button id="notif-toggle" class="icon-btn" title="Enable notifications" aria-label="Toggle notifications">🔕</button>
        <button id="clear-chat-btn" class="icon-btn" title="Clear all messages" aria-label="Clear all messages" style="display:none">🗑️</button>
        <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
      </div>
    </header>

    <div id="messages-container" role="log" aria-label="Messages" aria-live="polite">
      <div id="messages-list" role="list"></div>

      <div id="typing-indicator" class="hidden" aria-live="polite" aria-atomic="true">
        <div class="typing-dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <span class="typing-text" id="typing-text"></span>
      </div>

      <div id="new-msg-toast" class="hidden" role="button" tabindex="0" aria-label="New messages. Click to scroll down.">↓ New messages</div>
      <button id="scroll-bottom-btn" aria-label="Scroll to bottom" tabindex="0">↓</button>
    </div>

    <div id="reply-bar" class="hidden" role="status" aria-live="polite">
      <div class="reply-indicator">
        <div class="reply-line" aria-hidden="true"></div>
        <div class="reply-info">
          <span class="reply-sender" id="reply-sender"></span>
          <span class="reply-content" id="reply-content"></span>
        </div>
      </div>
      <button id="reply-close" class="icon-btn" aria-label="Cancel reply">✕</button>
    </div>

    <div class="input-area" role="form" aria-label="Message input">
      <button id="image-btn" class="icon-btn" title="Send image" aria-label="Upload image">📷</button>
      <div id="input-wrapper">
        <textarea id="message-input" placeholder="Type a message..." rows="1" aria-label="Message text" enterkeyhint="send"></textarea>
      </div>
      <button id="send-btn" class="icon-btn send-btn" title="Send" aria-label="Send message">➤</button>
    </div>
  </div>

  <div id="format-toolbar" class="hidden" role="toolbar" aria-label="Text formatting">
    <button data-format="bold" title="Bold" aria-label="Bold"><strong>B</strong></button>
    <button data-format="italic" title="Italic" aria-label="Italic"><em>I</em></button>
    <button data-format="strikethrough" title="Strikethrough" aria-label="Strikethrough"><s>S</s></button>
    <button data-format="highlight" title="Highlight" aria-label="Highlight"><mark>H</mark></button>
  </div>

  <div id="reaction-picker" class="hidden" role="dialog" aria-label="Choose reaction">
    <button aria-label="Like">👍</button><button aria-label="Heart">❤️</button><button aria-label="Laugh">😂</button><button aria-label="Surprise">😮</button>
    <button aria-label="Sad">😢</button><button aria-label="Pray">🙏</button><button aria-label="Fire">🔥</button><button aria-label="Party">🎉</button>
    <button aria-label="Angry">😡</button><button aria-label="Skull">💀</button><button aria-label="Dislike">👎</button>
    <button aria-label="Clap">👏</button><button aria-label="Sparkles">✨</button><button aria-label="Rocket">😭</button>
    <button aria-label="Eyes">👀</button><button aria-label="100">💯</button><button aria-label="Mind blown">🤯</button><button aria-label="Salute">🫡</button>
  </div>

  <input type="file" id="image-upload" accept="image/*" hidden aria-hidden="true">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
